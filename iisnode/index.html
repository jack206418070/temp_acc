<html>
<head>
    <title>iisnode logs</title>
    <style type="text/css">
        body
        {
            font-family: "Trebuchet MS" , Arial, Helvetica, sans-serif;
        }
        table
        {
            border-collapse: collapse;
        }
        td, th
        {
            border: 1px solid lightgray;
            padding: 3px 7px 2px 7px;
        }
        th
        {
            text-align: left;
            padding-top: 5px;
            padding-bottom: 4px;
            background-color: Gray;
            color: #ffffff;
        }
        td.stderr
        {
            color: Red;
        }
    </style>
</head>
<body>
    <table id="logFilesTable">
        <tr>
            <th>
                Computer name
            </th>
            <th>
                PID
            </th>
            <th>
                Type
            </th>
            <th>
                Created
            </th>
            <th>
                Link
            </th>
        </tr>
    </table>
    <p id="lastUpdated"></p>
    <script type="text/javascript">

        // this is replaced with actual data at runtime by code in interceptor.js
        var logFiles = [{"file":"mcs-dev-1272-stderr-1747673687889.txt","computername":"mcs-dev","pid":1272,"type":"stderr","created":1747673687889},{"file":"mcs-dev-1272-stdout-1747673687888.txt","computername":"mcs-dev","pid":1272,"type":"stdout","created":1747673687888},{"file":"mcs-dev-1544-stderr-1747675128862.txt","computername":"mcs-dev","pid":1544,"type":"stderr","created":1747675128862},{"file":"mcs-dev-1544-stdout-1747675128854.txt","computername":"mcs-dev","pid":1544,"type":"stdout","created":1747675128854},{"file":"mcs-dev-2280-stderr-1747675649680.txt","computername":"mcs-dev","pid":2280,"type":"stderr","created":1747675649680},{"file":"mcs-dev-2280-stdout-1747675649678.txt","computername":"mcs-dev","pid":2280,"type":"stdout","created":1747675649678},{"file":"mcs-dev-3460-stderr-1747672941489.txt","computername":"mcs-dev","pid":3460,"type":"stderr","created":1747672941489},{"file":"mcs-dev-3460-stdout-1747672941489.txt","computername":"mcs-dev","pid":3460,"type":"stdout","created":1747672941489},{"file":"mcs-dev-5628-stderr-1747673683462.txt","computername":"mcs-dev","pid":5628,"type":"stderr","created":1747673683462},{"file":"mcs-dev-5628-stdout-1747673683461.txt","computername":"mcs-dev","pid":5628,"type":"stdout","created":1747673683461},{"file":"mcs-dev-5680-stderr-1747673126639.txt","computername":"mcs-dev","pid":5680,"type":"stderr","created":1747673126639},{"file":"mcs-dev-5884-stderr-1747673262834.txt","computername":"mcs-dev","pid":5884,"type":"stderr","created":1747673262834},{"file":"mcs-dev-5884-stdout-1747673262833.txt","computername":"mcs-dev","pid":5884,"type":"stdout","created":1747673262833},{"file":"mcs-dev-7696-stderr-1747673208734.txt","computername":"mcs-dev","pid":7696,"type":"stderr","created":1747673208734},{"file":"mcs-dev-7696-stdout-1747673208733.txt","computername":"mcs-dev","pid":7696,"type":"stdout","created":1747673208733}];
        var lastUpdated = 1747675650076;
        var date = new Date();

        date.setTime(lastUpdated);
        document.getElementById('lastUpdated').innerHTML = 'Index was last updated ' + date;

        logFiles.sort(function (a, b) {
            return b.created - a.created;
        });

        var logFilesTable = document.getElementById("logFilesTable");
        for (var i = 0; i < logFiles.length; i++) {
            var logFile = logFiles[i];
            date.setTime(logFile.created);
            var row = logFilesTable.insertRow(-1);
            var computerNameCell = row.insertCell(0);
            var pidCell = row.insertCell(1);
            var typeCell = row.insertCell(2);
            var dateCell = row.insertCell(3);
            var logCell = row.insertCell(4);
            computerNameCell.innerHTML = logFile.computername;
            pidCell.innerHTML = logFile.pid.toString();
            typeCell.innerHTML = logFile.type;
            typeCell.setAttribute('class', logFile.type);
            dateCell.innerHTML = date.toString();
            logCell.innerHTML = '<a href="' + logFile.file + '">log</a>';
        };

    </script>
</body>
</html>
